[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Backend API for Prelegal legal document SaaS"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic[email]>=2.10.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
    # Cap below 1.92: newer litellm ships a mandatory Rust bridge that needs a
    # cargo toolchain to build. Older versions are pure-Python with wheels.
    "litellm>=1.55.0,<1.80.0",
]

[tool.uv]
package = false
